<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keisha, Will You Be My Valentine?</title>

<style>
body {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    background: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    max-width: 90%;
}

h1 {
    color: #e60073;
    margin-bottom: 10px;
}

p {
    font-size: 1.2em;
}

button {
    font-size: 1.3em;
    padding: 12px 25px;
    margin: 15px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: white;
    background-color: #ff4d94;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.1);
}

#noBtn {
    position: relative;
}

.coupons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.coupon {
    background: #fff;
    border: 3px dashed #ff4d94;
    border-radius: 15px;
    padding: 15px;
    width: 200px;
    animation: pop 0.5s ease;
}

@keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.heart {
    position: absolute;
    color: #ff4d94;
    font-size: 24px;
    animation: float 4s linear infinite;
    pointer-events: none;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="container" id="main">
    <h1>Hey Keisha January 💖</h1>
    <p>Will you be my Valentine?</p>

    <button onclick="yesClicked()">Yes ❤️</button>
    <button id="noBtn">No 😢</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function yesClicked() {
    document.getElementById("main").innerHTML = `
        <h1>YAYYY!! 🎉💖</h1>
        <p>You’re officially my Valentine 🥰</p>

        <div class="coupons">
            <div class="coupon">💞 Unlimited Hugs<br>Redeem anytime</div>
            <div class="coupon">💋 Unlimited Kisses<br>No expiry</div>
            <div class="coupon">🍿 Movie Night<br>Your choice</div>
        </div>
    `;
}

// floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}, 300);
</script>

</body>
</html>
